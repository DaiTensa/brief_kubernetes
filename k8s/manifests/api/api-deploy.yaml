apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deploy
  namespace: dai-simplon
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: sengsathit/brief-api:latest
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_PORT
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: USER_NAME
            - name: MYSQL_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: USER_PASSWORD
            - name: MYSQL_DB
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_NAME
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
